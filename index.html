<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUOLINGO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0F172A; /* Slate 900 */
        color: white;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }
      
      /* Glassmorphism Utilities */
      .glass-panel {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      /* Animations */
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      
      @keyframes talking-mouth {
        0% { transform: scaleY(1); }
        25% { transform: scaleY(0.4); }
        50% { transform: scaleY(0.8); }
        75% { transform: scaleY(0.2); }
        100% { transform: scaleY(1); }
      }
      .speaking-mouth {
        transform-origin: center;
        animation: talking-mouth 0.3s infinite;
      }

      /* Photo Talking Animation (Squash & Stretch) */
      @keyframes talking-head {
        0% { transform: scale(1); }
        20% { transform: scaleY(1.03) scaleX(0.98) translateY(1px); }
        40% { transform: scaleY(0.98) scaleX(1.02) translateY(-1px); }
        60% { transform: scaleY(1.03) scaleX(0.98) translateY(1px); }
        80% { transform: scaleY(0.99) scaleX(1.01) translateY(0px); }
        100% { transform: scale(1); }
      }
      .animate-talking-head {
        animation: talking-head 0.4s ease-in-out infinite;
        transform-origin: bottom center;
      }

      @keyframes pulse-ring {
        0% { transform: scale(0.8); opacity: 0.5; }
        100% { transform: scale(1.3); opacity: 0; }
      }
      .animate-pulse-ring {
        animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
    </style>
  <script type="importmap">
{

    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0"
  }
}
</script>
</head>

    <div id="root"></div>
  </body>
</html>
